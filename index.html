<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Directories </title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="page">
      <header class="page__header">
        <div class="top-header">
          <div class="top-header__left-wrapper">
            <div class="menu-icon__container">
              <img class="menu-icon">
            </div>
            <h1 class="user-name__container">
              <a class="user-name"></a>
            </h1>
          </div>
          <div class="top-header__right-wrapper">
            <div class="create-new">
              <img class="create-new__icon">
              <img class="create-new__dropdown-icon"> 
            </div>
            <img class="top-header__profile-icon">
          </div>
        </div>

        <nav class="bottom-header">
          <ul class="bottom-header__nav-list">
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
          </ul>
        </nav>
      </header>

      <main class="page__main-content">
        <div class="main-content__container">
          <div class="user-profile">
            <img class="user-profile__profile-icon">
            <div class="user-profile__name-wrapper">
              <h2 class="user-profile__nick-name"></h2>
              <p class="user-profile__user-name"></p>
            </div>
            <p class="user-profile__bio"></p>
            <button class="user-profile__edit-btn"></button>
            <div class="contact-info">
              <img class="contact-info__icon">
              <p class="contact-info__text"></p>
            </div>
          </div>

          <div class="directories__wrapper">
            <div class="add-directory__container">
              <button class="add-directory">
                <img class="add-directory__icon">
                <p class="add-directory__text"></p>
              </button>
            </div>
            <div class="directories"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
