<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Your Directories </title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__top">
          <div class="header__top-left">
            <div class="menu-icon__wrapper" title="For decoration purposes only.">
              <img class="menu-icon ghost" src="icons/menu_24dp_AAAFB9_FILL0_wght400_GRAD0_opsz24.svg" alt="Menu Icon">
            </div>
            <h1 class="user-name__wrapper">
              <a class="user-name" href="https://github.com/Chris-Jacob-Dela-Cerna">Chris-Jacob-Dela-Cerna</a>
            </h1>
          </div>
          <div class="header__top-right">
            <div class="create-new" title="For decoration purposes only.">
              <img class="create-new__icon ghost" src="icons/add_24dp_AAAFB9_FILL0_wght400_GRAD0_opsz24.svg" alt="Add Icon">
              <img class="create-new__icon ghost" src="icons/arrow_drop_down_24dp_AAAFB9_FILL0_wght400_GRAD0_opsz24.svg" alt="Dropdown Icon"> 
            </div>
            <img class="header__profile-icon" src="img/hexeus_pink_logo.jpg" alt="Profile Picture" title="For decoration purposes only.">
          </div>
        </div>

        <nav class="header__bottom">
          <ul class="header__nav-list">
            <li class="nav-item__container">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna">
                <img class="nav-item__icon ghost" src="icons/import_contacts_24dp_9198A1_FILL0_wght400_GRAD0_opsz24.svg" alt="Overview Icon">
                <p class="nav-item__name"> Overview </p>
              </a>
            </li>
            <li class="nav-item__container current-page">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna?tab=repositories">
                <img class="nav-item__icon ghost" src="icons/book_2_24dp_9198A1_FILL0_wght400_GRAD0_opsz24.svg" alt="Directories Icon">
                <p class="nav-item__name"> Directories </p>
              </a>
            </li>
            <li class="nav-item__container">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna?tab=stars">
                <img class="nav-item__icon ghost" src="icons/star_24dp_9198A1_FILL0_wght400_GRAD0_opsz24.svg" alt="Star Icon">
                <p class="nav-item__name"> Stars </p>
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <main class="main-content">
        <div class="main-content__container">
          <div class="user-profile">
            <img class="user-profile__icon ghost" src="img/hexeus_pink_logo.jpg" alt="Profile Picture">
            <div class="user-profile__names-wrapper">
              <h2 class="user-profile__display-name"> Chris Jacob Dela Cerna </h2>
              <p class="user-profile__user-name"> Chris-Jacob-Dela-Cerna </p>
            </div>
            <p class="user-profile__bio"> A CS student building in public. </p>
            <button class="user-profile__follow-btn"> Follow </button>
            <div class="contact-info">
              <img class="contact-info__icon ghost" src="icons/mail_24dp_828C91_FILL0_wght400_GRAD0_opsz24.svg" alt="Email Icon">
              <p class="contact-info__text"> b1.tgr0509@gmail.com </p>
            </div>
          </div>

          <div class="directories">
            <div class="directories__options">
              <div class="new-directory">
                <button class="new-directory__btn">
                  <img class="new-directory__btn-icon ghost" src="icons/book_2_24dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="New Directory Icon">
                  <p class="new-directory__btn-text"> New </p>
                </button>

                <dialog class="new-directory__dialog" closedby="closerequest">
                  <button class="dialog__close-btn">
                    <img class="dialog__close-btn-icon" src="icons/close_24dp_F0F0F0_FILL0_wght400_GRAD0_opsz24.svg" alt="Close Button">
                  </button>
                  <div class="dialog-header">
                    <div class="dialog-header__text-wrapper">
                      <h3 class="dialog-header__heading"> Create a new directory </h3>
                      <p class="dialog-header__note"> 
                        <em> Required fields are marked with an asterisk (*). </em>
                      </p>
                    </div>
                  </div>
                  <form id="dialog-form" class="dialog-form" action="#">
                    <div class="dialog-form__input-wrapper">
                      <label for="dialog-form__directory-name" class="dialog-form__label"> Repository Name * </label>
                      <input id="dialog-form__directory-name" class="dialog-form__input" name="name" type="text" minlength="1" maxlength="20" pattern="^[a-zA-Z0-9._\-]+$" title="Repository name can only contain letters, numbers, hyphens, underscores, and periods." autofocus required>
                    </div>
                    <div class="dialog-form__input-wrapper">
                      <label for="dialog-form__directory-description" class="dialog-form__label"> Description </label>
                      <input id="dialog-form__directory-description" class="dialog-form__input" name="description" type="text" maxlength="250" title="Description cannot exceed 250 characters.">
                    </div>
                  </form>
                  <button class="dialog-form__submit-btn" form="dialog-form" formmethod="dialog" type="submit"> Create Directory </button>
                </dialog>
              </div>
            </div>
            <ul class="directories__list"></ul>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
