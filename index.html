<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Directories </title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="page">
      <header class="page__header">
        <div class="header__top">
          <div class="header__top-left">
            <div class="menu-icon__container">
              <img class="menu-icon">
            </div>
            <h1 class="user-name__container">
              <a class="user-name" href="#">Chris-Jacob-Dela-Cerna</a>
            </h1>
          </div>
          <div class="header__top-right">
            <div class="create-new">
              <img class="create-new__icon">
              <img class="create-new__dropdown-icon"> 
            </div>
            <img class="header__profile-icon">
          </div>
        </div>

        <nav class="header__bottom">
          <ul class="bottom-header__nav-list">
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
            <li class="nav-item">
              <img class="nav-item__icon">
              <p class="nav-item__name"></p>
            </li>
          </ul>
        </nav>
      </header>

      <main class="page__main-content">
        <div class="main-content__container">
          <div class="user-profile">
            <div class="user-profile__icon-container">
              <img class="user-profile__icon">
            </div>
            <div class="user-profile__names-wrapper">
              <h2 class="user-profile__nick-name"> Chris Jacob Dela Cerna </h2>
              <p class="user-profile__user-name"> Chris-Jacob-Dela-Cerna </p>
            </div>
            <p class="user-profile__bio"> A CS student building in public. </p>
            <button class="user-profile__edit-btn"> Edit profile </button>
            <div class="contact-info">
              <img class="contact-info__icon">
              <p class="contact-info__text"> johndoe2005@domain.not.real </p>
            </div>
          </div>

          <div class="directories__wrapper">
            <div class="directories__options">
              <button class="add-dir-btn">
                <img class="add-dir-btn__icon">
                <p class="add-dir-btn__text"> New </p>
              </button>
            </div>
            <div class="directories"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
