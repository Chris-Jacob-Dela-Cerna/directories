<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Your Directories </title>
    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="header__top">
          <div class="header__top-left">
            <div class="menu-icon__wrapper">
              <img class="menu-icon ghost">
            </div>
            <h1 class="user-name__wrapper">
              <a class="user-name" href="https://github.com/Chris-Jacob-Dela-Cerna">Chris-Jacob-Dela-Cerna</a>
            </h1>
          </div>
          <div class="header__top-right">
            <div class="create-new">
              <img class="create-new__icon ghost">
              <img class="create-new__icon ghost"> 
            </div>
            <img class="header__profile-icon ghost">
          </div>
        </div>

        <nav class="header__bottom">
          <ul class="header__nav-list">
            <li class="nav-item__container">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna">
                <img class="nav-item__icon ghost">
                <p class="nav-item__name"> Overview </p>
              </a>
            </li>
            <li class="nav-item__container current-page">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna?tab=repositories">
                <img class="nav-item__icon ghost">
                <p class="nav-item__name"> Directories </p>
              </a>
            </li>
            <li class="nav-item__container">
              <a class="nav-item" href="https://github.com/Chris-Jacob-Dela-Cerna?tab=stars">
                <img class="nav-item__icon ghost">
                <p class="nav-item__name"> Stars </p>
              </a>
            </li>
          </ul>
        </nav>
      </header>

      <main class="main-content">
        <div class="main-content__container">
          <div class="user-profile">
            <img class="user-profile__icon ghost">
            <div class="user-profile__names-wrapper">
              <h2 class="user-profile__display-name"> Chris Jacob Dela Cerna </h2>
              <p class="user-profile__user-name"> Chris-Jacob-Dela-Cerna </p>
            </div>
            <p class="user-profile__bio"> A CS student building in public. </p>
            <button class="user-profile__follow-btn" id="user-profile__follow-btn"> Follow </button>
            <div class="contact-info">
              <img class="contact-info__icon ghost">
              <p class="contact-info__text"> b1.tgr0509@gmail.com </p>
            </div>
          </div>

          <div class="directories">
            <div class="directories__options">
              <button class="add-dir-btn">
                <img class="add-dir-btn__icon ghost">
                <p class="add-dir-btn__text"> New </p>
              </button>
            </div>
            <ul class="directories__list" id="directories__list"></ul>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
